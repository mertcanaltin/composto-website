<text x="168" y="132" text-anchor="end" fill="#555" style="font-size:12px;font-weight:600;font-family:'IBM Plex Mono',monospace;fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:12px;font-weight:600;text-anchor:end;dominant-baseline:auto">With Composto</text>
