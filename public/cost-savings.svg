<line x1="596" y1="92" x2="596" y2="114" stroke="#d97757" stroke-width="1" stroke-dasharray="3 2" style="fill:rgb(0, 0, 0);stroke:rgb(217, 119, 87);color:rgb(255, 255, 255);stroke-width:1px;stroke-dasharray:3px, 2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<rect x="448" y="152" width="184" height="28" rx="6" fill="#fff" stroke="#d97757" stroke-width="1" style="fill:rgb(255, 255, 255);stroke:rgb(217, 119, 87);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="540" y="171" text-anchor="middle" fill="#d97757" style="font-size:12px;font-weight:700;font-family:'IBM Plex Mono',monospace;fill:rgb(217, 119, 87);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:auto">Save $849/mo · 90.4% less</text>

<!-- x axis -->
<line x1="176" y1="100" x2="596" y2="100" stroke="#e0dbd4" stroke-width="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(224, 219, 212);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- caption -->
<text x="340" y="202" text-anchor="middle" fill="#bbb" style="font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:1px;fill:rgb(187, 187, 187);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Same accuracy · same answers · 10× cheaper</text>

