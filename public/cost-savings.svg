<rect x="176" y="60" width="420" height="32" rx="4" fill="#d0cbc5" style="fill:rgb(208, 203, 197);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="604" y="81" fill="#1a1a1a" style="font-size:18px;font-weight:700;font-family:'IBM Plex Mono',monospace;fill:rgb(26, 26, 26);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:18px;font-weight:700;text-anchor:start;dominant-baseline:auto">$939</text>
<text x="648" y="81" fill="#888" style="font-size:11px;font-family:'IBM Plex Mono',monospace;fill:rgb(136, 136, 136);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">/mo</text>

