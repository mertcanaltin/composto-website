<text x="604" y="137" fill="#d97757" style="font-size:18px;font-weight:700;font-family:'IBM Plex Mono',monospace;fill:rgb(217, 119, 87);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:18px;font-weight:700;text-anchor:start;dominant-baseline:auto">$90</text>
<text x="638" y="137" fill="#d97757" style="font-size:11px;font-family:'IBM Plex Mono',monospace;fill:rgb(217, 119, 87);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">/mo</text>

