<svg width="100%" viewBox="0 0 680 490" role="img" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">AST Iceberg</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Above water (14%): IR tokens LLM needs. Below water (86%): syntax noise that gets dropped.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Background -->
<rect x="0" y="0" width="680" height="480" fill="#F5F2EF" style="fill:rgb(245, 242, 239);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Water fill -->
<rect x="0" y="196" width="680" height="284" fill="#ddeef8" opacity="0.5" style="fill:rgb(221, 238, 248);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Water surface line -->
<line x1="0" y1="196" x2="680" y2="196" stroke="#a8ccde" stroke-width="1.5" style="fill:rgb(0, 0, 0);stroke:rgb(168, 204, 222);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- "What your LLM sees" waterline label -->
<text x="40" y="188" fill="#7aaac8" style="font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;fill:rgb(122, 170, 200);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:10px;font-weight:600;text-anchor:start;dominant-baseline:auto">What your LLM sees</text>

<!-- ── ABOVE WATER: iceberg tip ── trapezoid centered x=340 -->
<polygon points="258,44 422,44 468,194 212,194" fill="#fff" stroke="#d0cbc5" stroke-width="1" style="fill:rgb(255, 255, 255);stroke:rgb(208, 203, 197);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- 14% label — right of tip -->
<text x="494" y="90" fill="#d97757" style="font-size:44px;font-weight:700;letter-spacing:-2px;font-family:'IBM Plex Mono',monospace;fill:rgb(217, 119, 87);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:44px;font-weight:700;text-anchor:start;dominant-baseline:auto">14%</text>
<text x="496" y="116" fill="#888" style="font-size:11px;font-weight:600;letter-spacing:1px;font-family:'IBM Plex Mono',monospace;fill:rgb(136, 136, 136);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:11px;font-weight:600;text-anchor:start;dominant-baseline:auto">What your LLM</text>
<text x="496" y="131" fill="#888" style="font-size:11px;font-weight:600;letter-spacing:1px;font-family:'IBM Plex Mono',monospace;fill:rgb(136, 136, 136);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:11px;font-weight:600;text-anchor:start;dominant-baseline:auto">actually needs</text>

<!-- IR tokens above water -->
<text x="340" y="96" text-anchor="middle" fill="#d97757" style="font-size:13px;font-weight:700;letter-spacing:2px;font-family:'IBM Plex Mono',monospace;fill:rgb(217, 119, 87);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:auto">FN: · CLASS: · IF:</text>
<text x="340" y="118" text-anchor="middle" fill="#d97757" style="font-size:12px;font-weight:600;letter-spacing:1px;font-family:'IBM Plex Mono',monospace;fill:rgb(217, 119, 87);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:auto">RETURN · IMPORT · CALL:</text>
<text x="340" y="138" text-anchor="middle" fill="#c47040" style="font-size:11px;font-weight:400;letter-spacing:1px;font-family:'IBM Plex Mono',monospace;fill:rgb(196, 112, 64);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">FOR: · WHILE: · PARAM:</text>
<text x="340" y="157" text-anchor="middle" fill="#c87848" style="font-size:11px;font-weight:400;letter-spacing:1px;font-family:'IBM Plex Mono',monospace;fill:rgb(200, 120, 72);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">ASSIGN: · TYPE: · TRY:</text>

<!-- ── BELOW WATER: massive iceberg body ── -->
<polygon points="212,196 468,196 528,446 152,446" fill="#c8e0f0" stroke="#a8ccde" stroke-width="0.5" style="fill:rgb(200, 224, 240);stroke:rgb(168, 204, 222);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- 86% label — left of body -->
<text x="36" y="296" fill="#1a3a52" style="font-size:56px;font-weight:700;letter-spacing:-3px;font-family:'IBM Plex Mono',monospace;fill:rgb(26, 58, 82);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:56px;font-weight:700;text-anchor:start;dominant-baseline:auto">86%</text>
<text x="40" y="328" fill="#5a8aaa" style="font-size:11px;font-weight:600;letter-spacing:1px;font-family:'IBM Plex Mono',monospace;fill:rgb(90, 138, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:11px;font-weight:600;text-anchor:start;dominant-baseline:auto">What you send</text>
<text x="40" y="343" fill="#5a8aaa" style="font-size:11px;font-weight:600;letter-spacing:1px;font-family:'IBM Plex Mono',monospace;fill:rgb(90, 138, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:11px;font-weight:600;text-anchor:start;dominant-baseline:auto">anyway</text>

<!-- syntax noise tokens inside body, fading deeper -->
<text x="340" y="234" text-anchor="middle" fill="#2a5a7a" style="font-size:20px;font-weight:700;letter-spacing:6px;font-family:'IBM Plex Mono',monospace;fill:rgb(42, 90, 122);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:auto">{ ; " ( ) , . }</text>
<text x="340" y="264" text-anchor="middle" fill="#3a6a8a" style="font-size:15px;font-weight:600;letter-spacing:4px;font-family:'IBM Plex Mono',monospace;fill:rgb(58, 106, 138);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:auto">=&gt; == === &amp;&amp; || ! ?</text>
<text x="340" y="291" text-anchor="middle" fill="#4a7a9a" style="font-size:13px;font-weight:400;letter-spacing:3px;font-family:'IBM Plex Mono',monospace;fill:rgb(74, 122, 154);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:13px;font-weight:400;text-anchor:middle;dominant-baseline:auto">: :: ... &lt; &gt; + - * /</text>
<text x="340" y="315" text-anchor="middle" fill="#5a8aaa" style="font-size:12px;font-weight:400;letter-spacing:2px;font-family:'IBM Plex Mono',monospace;fill:rgb(90, 138, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">whitespace  newlines  indentation</text>
<text x="340" y="337" text-anchor="middle" fill="#6a9ab8" style="font-size:12px;font-weight:400;letter-spacing:2px;font-family:'IBM Plex Mono',monospace;fill:rgb(106, 154, 184);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">string content  comments  formatting</text>
<text x="340" y="358" text-anchor="middle" fill="#7aaac8" style="font-size:11px;font-weight:400;letter-spacing:1px;font-family:'IBM Plex Mono',monospace;fill:rgb(122, 170, 200);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">null  undefined  void  private  public  static</text>
<text x="340" y="378" text-anchor="middle" fill="#8abbd8" style="font-size:11px;font-weight:400;letter-spacing:1px;font-family:'IBM Plex Mono',monospace;fill:rgb(138, 187, 216);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">let  var  const  readonly  override  async</text>
<text x="340" y="397" text-anchor="middle" fill="#9acce8" style="font-size:11px;font-weight:400;opacity:0.8;letter-spacing:1px;font-family:'IBM Plex Mono',monospace;fill:rgb(154, 204, 232);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.8;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">punctuation  brackets  operators  keywords</text>
<text x="340" y="416" text-anchor="middle" fill="#aaddf8" style="font-size:10px;font-weight:400;opacity:0.6;letter-spacing:1px;font-family:'IBM Plex Mono',monospace;fill:rgb(170, 221, 248);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.6;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">semicolons  braces  parentheses  quotes</text>
<text x="340" y="434" text-anchor="middle" fill="#bbecff" style="font-size:10px;font-weight:400;opacity:0.35;letter-spacing:2px;font-family:'IBM Plex Mono',monospace;fill:rgb(187, 236, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.35;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">· · · · · · · · · · · · · · · · · ·</text>

<!-- caption -->
<text x="340" y="464" text-anchor="middle" fill="#aaa" style="font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:2px;fill:rgb(170, 170, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Composto drops what's below the line</text>

</svg>